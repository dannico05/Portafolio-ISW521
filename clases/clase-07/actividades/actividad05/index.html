<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout Flexbox</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="logo">LOGO</div>

        <div class="links">
            <a href="#">Inicio</a>
            <a href="#">Servicios</a>
            <a href="#">Contacto</a>
        </div>

        <button class="cta">CTA</button>
    </nav>

    <!-- CONTENIDO -->
    <main class="wrapper">

        <aside class="sidebar">
            SIDEBAR<br>
            (flex:1)
        </aside>

        <section class="contenido">
            CONTENIDO<br>
            (flex:3)
        </section>

        <aside class="panel">
            PANEL<br>
            (flex:1)
        </aside>

    </main>

    <!-- FOOTER -->
    <footer class="footer">

        <div>Columna 1</div>
        <div>Columna 2</div>
        <div>Columna 3</div>

    </footer>

</body>
</html>
